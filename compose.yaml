name: stock-reservation-api
services:
  db:
    # PostgreSQL 18.6-bookworm, pinned multi-platform manifest.
    image: postgres@sha256:5c4783a8cc3f0074912164f94dfa1be4e043438f0f707cf968d7af9a0d31a2c8
    environment:
      POSTGRES_DB: stock_reservation
      POSTGRES_USER: ${DB_USERNAME:-stock_reservation}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-local-demo-only}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s
volumes:
  pgdata:
